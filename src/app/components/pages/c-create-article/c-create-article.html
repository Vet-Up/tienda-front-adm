<div class="c-create-article">
  <!-- Header -->
  <header class="c-create-article__header">
    <h2 class="c-create-article__title">Create Product</h2>
  </header>

  <!-- Formulario -->
  <form class="c-create-article__form" #articleForm="ngForm" (ngSubmit)="createArticle(articleForm)">
    
    <div class="c-create-article__group">
      <label class="c-create-article__label" for="name">Name</label>
      <input class="c-create-article__input" id="name" type="text" [(ngModel)]="article.name" name="name" required />
    </div>

    <div class="c-create-article__group">
      <label class="c-create-article__label" for="productDescription">Description</label>
      <textarea class="c-create-article__textarea" id="productDescription" [(ngModel)]="article.productDescription" name="productDescription" required></textarea>
    </div>

    <div class="c-create-article__group">
      <label class="c-create-article__label" for="basePrice">Base Price (€)</label>
      <input class="c-create-article__input" id="basePrice" type="number" step="0.01" min="0" [(ngModel)]="article.basePrice" name="basePrice" required />
    </div>

    <div class="c-create-article__group">
      <label class="c-create-article__label" for="discountedPrice">Discount (%)</label>
      <input class="c-create-article__input" id="discountedPrice" type="number" step="0.01" min="0" max="100" [(ngModel)]="article.discountedPrice" name="discountedPrice" required />
    </div>

    <div class="c-create-article__group">
      <label class="c-create-article__label" for="price">Final Price (€)</label>
      <input class="c-create-article__input" id="price" type="number" [value]="calculateFinalPrice()" readonly />
    </div>

    <div class="c-create-article__group">
      <label class="c-create-article__label" for="pictureProduct">Image (URL)</label>
      <input class="c-create-article__input" id="pictureProduct" type="text" [(ngModel)]="article.pictureProduct" name="pictureProduct" />
    </div>

    <div class="c-create-article__group">
      <label class="c-create-article__label" for="brand">Brand</label>
      <input class="c-create-article__input" id="brand" type="text" [(ngModel)]="article.brand" name="brand" required />
    </div>

    <div class="c-create-article__group">
      <label class="c-create-article__label" for="categoryId">Category</label>
      <select class="c-create-article__input" id="categoryId" [(ngModel)]="article.categoryId" name="categoryId" required>
        <option value="" disabled>Choose a category</option>
        <option *ngFor="let category of categories" [value]="category.categoryId">{{ category.name }}</option>
      </select>
    </div>

    <div class="c-create-article__actions">
      <button class="c-create-article__btn c-create-article__btn--primary" type="submit">
        Create Product
      </button>
      <button class="c-create-article__btn" type="button" (click)="cancel()">
        Cancel
      </button>
    </div>
  </form>
</div>
