<div class="c-modify-article">
  <!-- Header -->
  <header class="c-modify-article__header">
    <h2 class="c-modify-article__title">Edit Product</h2>
  </header>

  <!-- Formulario -->
  <form class="c-modify-article__form" (ngSubmit)="saveChanges()">
    
    <div class="c-modify-article__group">
      <label class="c-modify-article__label" for="name">Name</label>
      <input class="c-modify-article__input" id="name" type="text" [(ngModel)]="article.name" name="name" required />
    </div>

    <div class="c-modify-article__group">
      <label class="c-modify-article__label" for="productDescription">Description</label>
      <textarea class="c-modify-article__textarea" id="productDescription" [(ngModel)]="article.productDescription" name="productDescription"></textarea>
    </div>

    <div class="c-modify-article__group">
      <label class="c-modify-article__label" for="basePrice">Base Price (€)</label>
      <input class="c-modify-article__input" id="basePrice" type="number" step="0.01" min="0" [(ngModel)]="article.basePrice" name="basePrice" required />
    </div>

    <div class="c-modify-article__group">
      <label class="c-modify-article__label" for="discount">Discount (%)</label>
      <input class="c-modify-article__input" id="discount" type="number" step="0.01" min="0" max="100" [(ngModel)]="article.discount" name="discount" required />
    </div>

    <div class="c-modify-article__group">
      <label class="c-modify-article__label" for="price">Final Price (€)</label>
      <input class="c-modify-article__input" id="price" type="number" [value]="calculateFinalPrice()" readonly />
    </div>

    <div class="c-modify-article__group">
      <label class="c-modify-article__label" for="stock">Stock</label>
      <input class="c-modify-article__input" id="stock" type="number" min="0" [(ngModel)]="article.stock" name="stock" required />
    </div>

    <div class="c-modify-article__group">
      <label class="c-modify-article__label" for="pictureProduct">Image (URL)</label>
      <input class="c-modify-article__input" id="pictureProduct" type="text" [(ngModel)]="article.pictureProduct" name="pictureProduct" />
    </div>

    <div class="c-modify-article__group">
      <label class="c-modify-article__label" for="brand">Brand</label>
      <input class="c-modify-article__input" id="brand" type="text" [(ngModel)]="article.brand" name="brand" />
    </div>

    <div class="c-modify-article__group">
      <label class="c-modify-article__label" for="categoryId">Category</label>
      <select class="c-modify-article__input" id="categoryId" [(ngModel)]="article.categoryId" name="categoryId" required>
        <option value="" disabled>Choose a category</option>
        <option *ngFor="let category of categories" [value]="category.categoryId">{{ category.name }}</option>
      </select>
    </div>

    <div class="c-modify-article__actions">
      <button class="c-modify-article__btn c-modify-article__btn--primary" type="submit">
        Save Changes
      </button>
      <button class="c-modify-article__btn" type="button" (click)="cancel()">
        Cancel
      </button>
    </div>
  </form>
</div>
