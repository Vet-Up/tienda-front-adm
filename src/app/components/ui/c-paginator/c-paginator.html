<nav class="c-paginator" role="navigation">
    <button class="c-paginator__btn c-paginator__btn--prev" type="button" [disabled]="isFirstPage"
        (click)="previousPage()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd"
                d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0" />
        </svg>
        Previous
    </button>

    <span class="c-paginator__info">
        Page {{ currentPage }} of {{ totalPages }}
    </span>

    <button class="c-paginator__btn c-paginator__btn--next" type="button" [disabled]="isLastPage" (click)="nextPage()">
        Next
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd"
                d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708" />
        </svg>
    </button>
</nav>
